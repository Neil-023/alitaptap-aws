name: Deploy Alitaptap Backend to AWS Lambda

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: deploy-alitaptap-backend
  cancel-in-progress: true

jobs:
  deploy-lambda:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Package
        run: |
          cd backend
          # Install dependencies into a 'package' folder with Lambda-compatible Linux binaries
          pip install -r requirements.txt -t ./package --platform manylinux2014_x86_64 --only-binary=:all:

          # Copy your Python code into the package folder
          cp -r ./*.py ./package/

          # Zip everything together
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1 # Ensure this matches your Lambda region

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name alitaptap-backend \
            --zip-file fileb://backend/deployment.zip

          # Wait for the AWS Lambda code update to finish processing
          aws lambda wait function-updated \
            --function-name alitaptap-backend

      - name: Update Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name alitaptap-backend \
            --environment "Variables={GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}',ENVIRONMENT='production',SSL_CERT_FILE='/etc/pki/tls/certs/ca-bundle.crt'}"
